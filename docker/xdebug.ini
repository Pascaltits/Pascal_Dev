; Xdebug 3 — voir https://xdebug.org/docs/all_settings
; Le mode et le déclenchement sont pilotés par les variables XDEBUG_MODE et XDEBUG_START_WITH_REQUEST
; (docker-compose.yml / .env). Valeurs par défaut ci-dessous.
zend_extension = xdebug

; La variable d'environnement XDEBUG_MODE a priorité sur cette valeur
xdebug.mode = debug,develop
xdebug.start_with_request = ${XDEBUG_START_WITH_REQUEST}

; Port d'écoute de l'IDE (VS Code, PhpStorm) : 9003 par défaut avec Xdebug 3
xdebug.client_port = 9003
; Détecte automatiquement l'adresse du client à partir de la requête HTTP (fonctionne en local et en Codespaces)
xdebug.discover_client_host = 1
; Repli si la découverte échoue (Docker Desktop, Linux avec host-gateway)
xdebug.client_host = host.docker.internal
xdebug.idekey = VSCODE

; Pas de bruit dans les logs quand aucun IDE n'écoute
xdebug.log_level = 0

; Profilage (XDEBUG_MODE=profile) : fichiers cachegrind dans /tmp/xdebug
xdebug.output_dir = /tmp/xdebug
xdebug.profiler_output_name = cachegrind.out.%t.%p

; Affichage amélioré des var_dump() (mode develop)
xdebug.var_display_max_depth = 5
xdebug.var_display_max_children = 256
xdebug.var_display_max_data = 1024
