# Intégration continue : syntaxe, style et analyse statique des plugins contre Dotclear.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

env:
  DC_VERSION: "2.39.3"

jobs:
  quality:
    name: Qualité (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, mysqli, simplexml, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Cache des sources Dotclear
        id: dc-cache
        uses: actions/cache@v4
        with:
          path: dotclear
          key: dotclear-${{ env.DC_VERSION }}

      - name: Télécharger Dotclear ${{ env.DC_VERSION }}
        if: steps.dc-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-dotclear.sh

      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Syntaxe PHP
        run: make lint

      - name: Style de code
        run: make cs

      - name: Analyse statique
        run: make stan

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de développement
        run: docker build --build-arg PHP_VERSION=8.3 -t dotclear-dev:ci docker
      - name: Vérifier PHP et Xdebug dans l'image
        run: |
          docker run --rm dotclear-dev:ci php -v
          docker run --rm dotclear-dev:ci php -m | grep -E -i '^(xdebug|mysqli|intl|gd|zip|mbstring|simplexml)$'
